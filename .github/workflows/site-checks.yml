name: site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: pip install markdown

      - name: Report unresolved legal placeholders
        run: python3 tools/build.py --check

      - name: Generated pages are up to date
        run: |
          python3 tools/build.py
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Generated legal pages are stale. Run tools/build.py and commit."
            git --no-pager diff --stat -- '*.html'
            exit 1
          fi

      - name: HTML sanity
        run: |
          fail=0
          for f in $(git ls-files '*.html'); do
            grep -q '<title>' "$f" || { echo "::error file=$f::missing <title>"; fail=1; }
            grep -q 'name="viewport"' "$f" || { echo "::error file=$f::missing viewport"; fail=1; }
            grep -q 'name="description"' "$f" || { echo "::error file=$f::missing meta description"; fail=1; }
          done
          exit $fail

      # The site owns static pages; stateful app traffic stays at app.seros.dev.
      # This also checks legacy seros.dev app URLs redirect rather than proxy.
      - name: Internal links and app handoff resolve
        run: python3 tools/check-links.py

      # The pivot from product to studio is easy to undo by accident. This pins it.
      - name: Studio positioning holds
        run: python3 tools/check-positioning.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package builder unit tests
        run: node tools/test_package_builder.mjs

      - name: No secrets in tree
        run: |
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git . ; then
            echo "::error::possible secret committed"; exit 1
          fi
